<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day2</title>
<style>
:root{
    --blue:#2563eb;
    --red:#dc2626;
    --border:#d1d5db;
    --bg:#f3f4f6;
    --card-bg:#ffffff;
}
  *{box-sizing:border-box;}
body{
    margin:0;
    padding:32px;
    background:var(--bg);
    font-family:"Segoe UI", Tahoma, Arial, sans-serif;
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:24px;
    max-width:1200px;
    margin:0 auto;
}
.card{
    background:var(--card-bg);
    border-radius:8px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    overflow:hidden;
    display:flex;
    flex-direction:column;
}
.card img{
    width:100%;
    height:260px;
    object-fit:cover;
    border-bottom:1px solid var(--border);
    background:#e5e7eb;
}
.card .body{
    padding:16px 20px 20px;
}
.card .desc{
    color:#6b7280;
    font-size:14px;
    margin-bottom:8px;
    min-height:20px;
}
.card .price{
    color:var(--blue);
    font-size:22px;
    font-weight:700;
    margin-bottom:16px;
}
.actions{
    display:flex;
    border-top:1px solid var(--border);
}
.actions button{
    flex:1;
    border:none;
    background:#fff;
    padding:12px 8px;
    font-size:15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
}
.actions button + button{
    border-right:1px solid var(--border);
}
    .btn-details{ color:var(--blue); }
    .btn-edit{ color:#374151; }
    .btn-delete{ color:var(--red); }
    .actions button:hover{ filter:brightness(0.97); }

.state-msg{
    grid-column:1 / -1;
    text-align:center;
    padding:40px;
    color:#6b7280;
    font-size:15px;
}
    .state-msg.error{ color:var(--red); }
</style>
</head>
<body>

<div class="grid" id="grid"></div>

<script src="script.js">
</script>

</body>
</html>
